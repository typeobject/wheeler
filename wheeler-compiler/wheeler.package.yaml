  - kind: "tool"
    name: "nativecompilervoidcallsourcewidthtests"
    root: "src/test/wheeler/compiler/NativeCompilerVoidCallSourceWidthTests.w"
    module: "wheeler.compiler.tests.native_compiler_void_call_source_widths"
    sources:
      - "src/main/wheeler/compiler/syntax/calls/VoidCallKinds.w"
      - "src/main/wheeler/compiler/syntax/calls/VoidCallSourceKinds.w"
      - "src/main/wheeler/compiler/syntax/calls/VoidCallSourceWidths.w"
      - "src/test/wheeler/compiler/NativeCompilerVoidCallSourceWidthTests.w"
    test: true
  - kind: "tool"
    name: "nativecompilervoidcallwidthtests"
    root: "src/test/wheeler/compiler/NativeCompilerVoidCallWidthTests.w"
    module: "wheeler.compiler.tests.native_compiler_void_call_widths"
    sources:
      - "src/main/wheeler/compiler/syntax/calls/VoidCallKinds.w"
      - "src/main/wheeler/compiler/syntax/calls/VoidCallWidths.w"
      - "src/test/wheeler/compiler/NativeCompilerVoidCallWidthTests.w"
    test: true
dependencies:
  - kind: "normal"
    name: "wheeler.core"
    version: "=0.1.0"
capabilities:
  - name: "build.read"
    path: "src/main/wheeler/**"
  - name: "build.write"
    path: "build/**"
