      - "src/main/wheeler/compiler/syntax/calls/VoidCallSourceKinds.w"
      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallIdentities.w"
      - "src/test/wheeler/compiler/NativeCompilerCallSyntaxTests.w"
    test: true
  - kind: "tool"
    name: "nativecompilercallwidthtests"
    root: "src/test/wheeler/compiler/NativeCompilerCallWidthTests.w"
    module: "wheeler.compiler.tests.native_compiler_call_widths"
    sources:
