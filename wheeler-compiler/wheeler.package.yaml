    name: "nativecompilersyntaxtests"
    root: "src/test/wheeler/compiler/NativeCompilerSyntaxTests.w"
    module: "wheeler.compiler.tests.native_compiler_syntax"
    sources:
      - "src/main/wheeler/compiler/ir/StorageOpcodes.w"
      - "src/main/wheeler/compiler/syntax/LoopKinds.w"
      - "src/main/wheeler/compiler/syntax/helpers/HelperAbi.w"
      - "src/main/wheeler/compiler/syntax/intrinsics/BorrowedIntrinsicKinds.w"
      - "src/main/wheeler/compiler/syntax/loops/LoopBodyOpcodes.w"
      - "src/main/wheeler/compiler/syntax/tokens/KeywordTokens.w"
      - "src/main/wheeler/compiler/syntax/tokens/SourceScalars.w"
      - "src/test/wheeler/compiler/NativeCompilerSyntaxTests.w"
    test: true
  - kind: "tool"
    name: "nativecompilertypekindtests"
    root: "src/test/wheeler/compiler/NativeCompilerTypeKindTests.w"
    module: "wheeler.compiler.tests.native_compiler_type_kinds"
    sources:
      - "src/main/wheeler/compiler/ir/TypeCodes.w"
      - "src/main/wheeler/compiler/ir/TypeKinds.w"
      - "src/test/wheeler/compiler/NativeCompilerTypeKindTests.w"
    test: true
