schema: 1
package:
  name: "wheeler.compiler"
  version: "0.1.0"
  profile: "bootstrap-1"
targets:
  - kind: "tool"
    name: "compiler"
    root: "src/main/wheeler/MinimalCompiler.w"
    module: "wheeler.compiler.main"
    sources:
      - "src/main/wheeler/MinimalCompiler.w"
      - "src/main/wheeler/compiler/Core.w"
      - "src/main/wheeler/compiler/Driver.w"
      - "src/main/wheeler/compiler/GraphFive.w"
      - "src/main/wheeler/compiler/GraphFour.w"
      - "src/main/wheeler/compiler/GraphSix.w"
      - "src/main/wheeler/compiler/Graphs.w"
      - "src/main/wheeler/compiler/backend"
      - "src/main/wheeler/compiler/closure"
      - "src/main/wheeler/compiler/frontend"
      - "src/main/wheeler/compiler/graphs"
      - "src/main/wheeler/compiler/ir"
      - "src/main/wheeler/compiler/packages"
      - "src/main/wheeler/compiler/resolution"
      - "src/main/wheeler/compiler/syntax"
      - "src/main/wheeler/compiler/verification/AggregateVerifier.w"
      - "src/main/wheeler/compiler/verification/FunctionVerifier.w"
      - "src/main/wheeler/compiler/verification/InstructionVerifier.w"
      - "src/main/wheeler/compiler/verification/ProofVerifier.w"
      - "src/main/wheeler/compiler/verification/ResultSlotVerifier.w"
      - "src/main/wheeler/compiler/verification/StorageVerifier.w"
      - "src/main/wheeler/compiler/verification/Verifier.w"
      - "src/main/wheeler/lexer"
    test: false
  - kind: "library"
    name: "library"
    root: "src/main/wheeler/CompilerLibrary.w"
    module: "wheeler.compiler.library"
    sources:
      - "src/main/wheeler/CompilerLibrary.w"
      - "src/main/wheeler/compiler"
      - "src/main/wheeler/lexer"
    test: false
  - kind: "tool"
    name: "nativecompilerspinetests"
    root: "src/test/wheeler/compiler/NativeCompilerSpineTests.w"
    module: "wheeler.compiler.tests.native_compiler_spine"
    sources:
      - "src/main/wheeler/compiler/backend/EncodingWidths.w"
      - "src/main/wheeler/compiler/ir/Opcodes.w"
      - "src/main/wheeler/compiler/ir/ProofRules.w"
      - "src/main/wheeler/compiler/ir/TypeCodes.w"
      - "src/main/wheeler/compiler/ir/limits/CompilerProgramLimits.w"
      - "src/main/wheeler/compiler/syntax/booleans/BooleanTokens.w"
      - "src/main/wheeler/compiler/syntax/tokens/CompilerTokenLimits.w"
      - "src/test/wheeler/compiler/NativeCompilerSpineTests.w"
    test: true
  - kind: "tool"
    name: "nativecompilersyntaxtests"
    root: "src/test/wheeler/compiler/NativeCompilerSyntaxTests.w"
    module: "wheeler.compiler.tests.native_compiler_syntax"
    sources:
      - "src/main/wheeler/compiler/ir/StorageOpcodes.w"
      - "src/main/wheeler/compiler/syntax/LoopKinds.w"
      - "src/main/wheeler/compiler/syntax/helpers/HelperAbi.w"
      - "src/main/wheeler/compiler/syntax/intrinsics/BorrowedIntrinsicKinds.w"
      - "src/main/wheeler/compiler/syntax/loops/LoopBodyOpcodes.w"
      - "src/main/wheeler/compiler/syntax/tokens/KeywordTokens.w"
      - "src/main/wheeler/compiler/syntax/tokens/SourceScalars.w"
      - "src/test/wheeler/compiler/NativeCompilerSyntaxTests.w"
    test: true
dependencies:
  - kind: "normal"
    name: "wheeler.core"
    version: "=0.1.0"
capabilities:
  - name: "build.read"
    path: "src/main/wheeler/**"
  - name: "build.write"
    path: "build/**"
