      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallCodeWidths.w"
      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallIdentities.w"
      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallInstructionWidths.w"
      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallLocalWidths.w"
      - "src/test/wheeler/compiler/NativeCompilerCallWidthTests.w"
    test: true
  - kind: "tool"
    name: "nativecompilerspinetests"
