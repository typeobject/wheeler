      - "src/main/wheeler/lexer"
    test: false
  - kind: "library"
    name: "library"
    root: "src/main/wheeler/CompilerLibrary.w"
    module: "wheeler.compiler.library"
    sources:
      - "src/main/wheeler/CompilerLibrary.w"
      - "src/main/wheeler/compiler"
      - "src/main/wheeler/lexer"
    test: false
  - kind: "tool"
    name: "nativecompilercallaritytests"
    root: "src/test/wheeler/compiler/NativeCompilerCallArityTests.w"
    module: "wheeler.compiler.tests.native_compiler_call_arity"
    sources:
      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallArities.w"
      - "src/main/wheeler/compiler/syntax/calls/assignment/AssignmentCallIdentities.w"
      - "src/test/wheeler/compiler/NativeCompilerCallArityTests.w"
    test: true
  - kind: "tool"
    name: "nativecompilercalloperandtests"
