// Disposable Java command adapters over stage-0 compiler, runtime, package, and core APIs.
dependencies {
    implementation project(':core')
    implementation project(':stage0')
    implementation project(':runtime')
    implementation project(':package')
}

def repositoryInputs = fileTree(rootProject.repositoryRoot) {
    include 'README.md'
    include 'CONTRIBUTING.md'
    include 'bootstrap/README.md'
    include 'docs/**/*.md'
    include 'docs/**/*.mdx'
    include 'wheeler-compiler/README.md'
    include 'wheeler-conformance/README.md'
    include 'wheeler-examples/README.md'
    include 'wheeler-compiler/src/main/wheeler/**/*.w'
    include 'wheeler-core/src/main/wheeler/**/*.w'
    include 'wheeler-examples/src/main/wheeler/**/*.w'
    include 'wheeler-package/src/main/wheeler/**/*.w'
    include 'wheeler-runtime/src/main/wheeler/**/*.w'
}
tasks.named('test') {
    workingDir rootProject.repositoryRoot
    inputs.files(repositoryInputs).withPathSensitivity(PathSensitivity.RELATIVE)
    exclude '**/NativeCompilerPackageTest.class'
}

tasks.register('nativeCompilerPackageTest', Test) {
    group = 'verification'
    description = 'Executes the complete Wheeler-owned compiler package suite.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/NativeCompilerPackageTest.class'
    workingDir = rootProject.repositoryRoot
    inputs.files(repositoryInputs).withPathSensitivity(PathSensitivity.RELATIVE)
    useJUnitPlatform()
    maxParallelForks = 1
    forkEvery = 0
    failFast = true
    maxHeapSize = '1024m'
    jvmArgs '-XX:ActiveProcessorCount=2'
    systemProperty 'junit.jupiter.execution.timeout.default', '2 m'
    systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'separate_thread'
    testLogging {
        events 'started', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

tasks.register('wheeler', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.typeobject.wheeler.tools.Wheeler'
    workingDir = rootProject.repositoryRoot
}
