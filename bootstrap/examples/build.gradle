// Java conformance harness for the executable Wheeler portfolio; never a production dependency.
dependencies {
    testImplementation project(':core')
    testImplementation project(':stage0')
    testImplementation project(':runtime')
    testImplementation project(':package')
}

def repository = rootProject.repositoryRoot
def conformanceRoot = new File(repository, 'wheeler-conformance')
def wheelerRoot = new File(repository, 'wheeler-examples')
def configureExampleInputs = { Test testTask ->
    testTask.workingDir wheelerRoot
    testTask.inputs.files(
        fileTree(new File(wheelerRoot, 'src/main/wheeler')) { include '**/*.w' },
        fileTree(new File(repository, 'wheeler-compiler/src/main/wheeler')) {
            include '**/*.w'
        },
        fileTree(new File(conformanceRoot, 'src/main/wheeler')) {
            include '**/*.w'
        },
        fileTree(new File(repository, 'wheeler-core/src/main/wheeler')) { include '**/*.w' },
        fileTree(new File(repository, 'wheeler-package/src/main/wheeler')) { include '**/*.w' },
        fileTree(new File(repository, 'wheeler-runtime/src/main/wheeler')) { include '**/*.w' },
        new File(conformanceRoot, 'wheeler.package.yaml'),
        new File(conformanceRoot, 'wheeler.package.lock.yaml'),
        new File(wheelerRoot, 'wheeler.package.yaml'),
        new File(wheelerRoot, 'wheeler.package.lock.yaml'))
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

def shardIndexText = findProperty('exampleTestShard')
def shardCountText = findProperty('exampleTestShardCount')
if ((shardIndexText == null) != (shardCountText == null)) {
    throw new GradleException('exampleTestShard and exampleTestShardCount must be set together')
}

def selectedExampleTests = []
def shardIndex = -1
def shardCount = -1
if (shardIndexText != null) {
    shardIndex = Integer.parseInt(shardIndexText.toString())
    shardCount = Integer.parseInt(shardCountText.toString())
    if (shardCount < 1 || shardCount > 64 || shardIndex < 0 || shardIndex >= shardCount) {
        throw new GradleException('invalid example test shard')
    }
    def testSourceRoot = file('src/test/java').toPath()
    def testClasses = fileTree(testSourceRoot) { include '**/*Test.java' }
        .files
        .sort { left, right -> left.path <=> right.path }
        .collect { source ->
            def relative = testSourceRoot.relativize(source.toPath()).toString()
                .replace(File.separator, '.')
            relative.substring(0, relative.length() - '.java'.length())
        }
    testClasses.eachWithIndex { className, position ->
        if (position % shardCount == shardIndex) {
            selectedExampleTests.add(className)
        }
    }
}

tasks.named('test', Test) { testTask ->
    useJUnitPlatform { excludeTags 'closure-evidence' }
    if (shardIndexText != null) {
        filter {
            selectedExampleTests.each { className -> includeTestsMatching className }
        }
        inputs.property('exampleTestShard', shardIndex)
        inputs.property('exampleTestShardCount', shardCount)
        timeout = java.time.Duration.ofMinutes(15)
    }
    configureExampleInputs(testTask)
}

tasks.register('closureEvidenceTest', Test) { testTask ->
    description = 'Rebuilds and links every retained physical compiler product.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'closure-evidence' }
    systemProperty 'junit.jupiter.execution.timeout.default', '24 m'
    timeout = java.time.Duration.ofMinutes(28)
    configureExampleInputs(testTask)
    shouldRunAfter tasks.named('test')
}
