// Java conformance harness for the executable Wheeler portfolio; never a production dependency.
dependencies {
    testImplementation project(':core')
    testImplementation project(':stage0')
    testImplementation project(':runtime')
    testImplementation project(':package')
}

def repository = rootProject.repositoryRoot
def conformanceRoot = new File(repository, 'wheeler-conformance')
def wheelerRoot = new File(repository, 'wheeler-examples')
def configureExampleInputs = { Test testTask ->
    testTask.workingDir wheelerRoot
    testTask.inputs.files(
        fileTree(new File(wheelerRoot, 'src/main/wheeler')) { include '**/*.w' },
        fileTree(new File(repository, 'wheeler-compiler/src/main/wheeler')) {
            include '**/*.w'
        },
        fileTree(new File(conformanceRoot, 'src/main/wheeler')) {
            include '**/*.w'
        },
        fileTree(new File(repository, 'wheeler-core/src/main/wheeler')) { include '**/*.w' },
        fileTree(new File(repository, 'wheeler-package/src/main/wheeler')) { include '**/*.w' },
        fileTree(new File(repository, 'wheeler-runtime/src/main/wheeler')) { include '**/*.w' },
        new File(conformanceRoot, 'wheeler.package.yaml'),
        new File(conformanceRoot, 'wheeler.package.lock.yaml'),
        new File(wheelerRoot, 'wheeler.package.yaml'),
        new File(wheelerRoot, 'wheeler.package.lock.yaml'))
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('test', Test) { testTask ->
    useJUnitPlatform { excludeTags 'closure-evidence' }
    configureExampleInputs(testTask)
}

tasks.register('closureEvidenceTest', Test) { testTask ->
    description = 'Rebuilds and links every retained physical compiler product.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'closure-evidence' }
    systemProperty 'junit.jupiter.execution.timeout.default', '10 m'
    timeout = java.time.Duration.ofMinutes(15)
    configureExampleInputs(testTask)
    shouldRunAfter tasks.named('test')
}
